<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SearchMate Config v10.0</title>
<style>
:root{--bg:#1a1c1f;--panel:#2a2d32;--bd:rgba(255,255,255,.12);--ac:#4ee08a;--tx:#e8e9eb;--mut:#9a9da3;--err:#ff5a52;--warn:#ffb443}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:14px;max-width:560px;margin:auto}
h1{font-size:15px;letter-spacing:.12em;color:var(--mut);margin:6px 0 14px}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.lbl{font-size:11px;letter-spacing:.1em;color:var(--mut);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}
input[type=text],input[type=password],input[type=date]{width:100%;padding:10px;border-radius:6px;border:1px solid var(--bd);background:#16181b;color:var(--tx);margin-bottom:8px;font-size:14px}
.opt{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--bd);border-radius:6px;margin-bottom:6px;cursor:pointer}
.opt.on{border-color:var(--ac);background:rgba(78,224,138,.08)}
.opt input{accent-color:var(--ac)}
.seg{display:flex;gap:8px}.seg .opt{flex:1;justify-content:center;margin:0}
button{width:100%;padding:13px;border-radius:6px;border:0;background:var(--ac);color:#06210f;font-weight:700;font-size:14px;letter-spacing:.05em;cursor:pointer}
button.sec{background:#3d4046;color:var(--tx);margin-top:8px}
#msg{margin-top:10px;font-size:13px;min-height:18px}
.ok{color:var(--ac)}.er{color:var(--err)}.wn{color:var(--warn)}
details summary{cursor:pointer;color:var(--mut);font-size:12px;letter-spacing:.08em;font-weight:700}
</style></head><body>
<h1>SEARCHMATE · DAILY CONFIG <span style="float:right;color:#4ee08a">v10.0</span></h1>

<div class="card"><details id="gh"><summary>GITHUB CONNECTION (one-time)</summary><div style="margin-top:12px">
<input type="text" id="owner" placeholder="GitHub username">
<input type="text" id="repo" placeholder="Repository name">
<input type="password" id="token" placeholder="Fine-grained token (Contents: read & write)">
<div style="font-size:12px;color:var(--mut)">Stored only in this browser. Never put the token in the repo.</div>
</div></details></div>

<div class="card"><div class="lbl"><span>PROFILE</span></div><div id="profiles"></div></div>

<div class="card"><div class="lbl"><span>TOPICS</span><span id="cnt">0/5</span></div><div id="topics"></div>
<div class="lbl" style="margin-top:12px"><span>WORDS PER TOPIC</span></div>
<div class="seg"><label class="opt" id="w1"><input type="radio" name="w" value="1">1</label><label class="opt" id="w2"><input type="radio" name="w" value="2" checked>2</label></div></div>

<div class="card"><div class="lbl"><span>DATE (auto-start only runs if this is today)</span></div>
<input type="date" id="date">
<label class="opt" id="asl"><input type="checkbox" id="auto" checked>Auto-start enabled</label></div>

<button id="save">SAVE &amp; SYNC</button>
<button class="sec" id="load">Reload current config</button>
<div id="msg"></div>

<script>
const TOPICS=[{"id": "topic1", "name": "Used Car"}, {"id": "topic2", "name": "Coupon Code And Discount"}, {"id": "topic3", "name": "Upgrade Your Space"}, {"id": "topic4", "name": "Stream Your Favourite"}, {"id": "topic5", "name": "Send A Smile"}, {"id": "topic6", "name": "Discover Open Job Role"}, {"id": "topic7", "name": "Too Tired To Cook(Restaurant Near)"}, {"id": "topic8", "name": "Explore Video Games"}, {"id": "topic9", "name": "Know Your Credit Score"}, {"id": "topic10", "name": "Sleep Better(Mattresses)"}, {"id": "topic11", "name": "Treat Your Pet"}, {"id": "topic12", "name": "Weather"}, {"id": "topic13", "name": "Who Win(game Score)"}, {"id": "topic14", "name": "Find Place To Stay(Hotel)"}, {"id": "topic15", "name": "Jwellery"}, {"id": "topic16", "name": "Real estate"}, {"id": "topic17", "name": "Take of Soon(Flight)"}, {"id": "topic18", "name": "Protect what matters(Insurance)"}, {"id": "topic19", "name": "Plan Your Future"}, {"id": "topic20", "name": "Find deal"}, {"id": "topic21", "name": "park with ease"}, {"id": "topic22", "name": "Feeling symptoms"}, {"id": "topic23", "name": "Learn new recipe"}, {"id": "topic24", "name": "Bank smarter"}, {"id": "topic25", "name": "catch the show"}, {"id": "topic26", "name": "Learn Song Lyrics"}, {"id": "topic27", "name": "Driver Your way(Car Rental)"}, {"id": "topic28", "name": "Talk,text,save"}, {"id": "topic29", "name": "Set sail"}, {"id": "topic30", "name": "Check Option"}, {"id": "topic31", "name": "Swipe Smart (Credit Card)"}, {"id": "topic32", "name": "what time"}, {"id": "topic33", "name": "vocabulary meaning search"}, {"id": "topic34", "name": "How's the Economy"}, {"id": "topic35", "name": "Healthy Living"}];
const PROFILES={pc_normal:'📲 (9-13 Sec)',pc_fast:'📲 (8-12 Sec)',pc_ultra:'📲 🔥 (7-11 Sec)',mobile_normal:'🪓 (6-10 Sec)'};
const MAX=5,$=id=>document.getElementById(id);
let profile='mobile_normal',topics=[];
const ls=k=>localStorage.getItem('sm_'+k)||'';
['owner','repo','token'].forEach(k=>{$(k).value=ls(k);$(k).oninput=()=>localStorage.setItem('sm_'+k,$(k).value.trim())});
if(!ls('owner')||!ls('token'))$('gh').open=true;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
$('date').value=today();
function say(t,c){$('msg').className=c||'';$('msg').textContent=t}
function render(){
 $('profiles').innerHTML='';
 for(const k in PROFILES){const l=document.createElement('label');l.className='opt'+(k===profile?' on':'');
  l.innerHTML='<input type="radio" name="p"'+(k===profile?' checked':'')+'>'+PROFILES[k];l.onclick=()=>{profile=k;render()};$('profiles').appendChild(l)}
 $('topics').innerHTML='';
 TOPICS.forEach(t=>{const on=topics.includes(t.id);const l=document.createElement('label');l.className='opt'+(on?' on':'');
  l.innerHTML='<input type="checkbox"'+(on?' checked':'')+'>'+t.name;
  l.onclick=e=>{e.preventDefault();if(on)topics=topics.filter(x=>x!==t.id);else if(topics.length<MAX)topics.push(t.id);else say('Max '+MAX+' topics','wn');render()};
  $('topics').appendChild(l)});
 $('cnt').textContent=topics.length+'/'+MAX;
 const w=document.querySelector('input[name=w]:checked').value;$('w1').className='opt'+(w==='1'?' on':'');$('w2').className='opt'+(w==='2'?' on':'');
 $('asl').className='opt'+($('auto').checked?' on':'');
}
document.querySelectorAll('input[name=w],#auto').forEach(e=>e.onchange=render);
function api(){const o=ls('owner'),r=ls('repo');if(!o||!r||!ls('token')){$('gh').open=true;throw new Error('Fill in GitHub connection first')}
 return {url:`https://api.github.com/repos/${o}/${r}/contents/config.json`,h:{Authorization:'Bearer '+ls('token'),Accept:'application/vnd.github+json'}}}
async function getCur(){const a=api();const r=await fetch(a.url+'?t='+Date.now(),{headers:a.h});
 if(r.status===404)return{sha:null,data:null};if(!r.ok)throw new Error('GitHub '+r.status+(r.status===401?' (bad token)':''));
 const j=await r.json();let data=null;try{data=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))))}catch(e){}
 return{sha:j.sha,data}}
async function load(){try{say('Loading…');const{data}=await getCur();
 if(data){profile=PROFILES[data.profile]?data.profile:profile;topics=(data.topics||[]).filter(id=>TOPICS.some(t=>t.id===id)).slice(0,MAX);
  document.querySelector('input[name=w][value="'+(data.wordsPerTopic===1?1:2)+'"]').checked=true;$('auto').checked=data.autoStart!==false;
  say('Loaded current config'+(data.date?' (date '+data.date+')':''),'ok')}else say('No config yet — will be created on Save','wn');
 render()}catch(e){say(e.message,'er')}}
async function save(){try{
 if(!topics.length)return say('Pick at least one topic','er');
 say('Saving…');const a=api();const{sha}=await getCur();
 const cfg={date:$('date').value||today(),topics,profile,wordsPerTopic:+document.querySelector('input[name=w]:checked').value,autoStart:$('auto').checked};
 const body={message:'Update SearchMate config '+cfg.date,content:btoa(unescape(encodeURIComponent(JSON.stringify(cfg,null,2)))),...(sha?{sha}:{})};
 const r=await fetch(a.url,{method:'PUT',headers:{...a.h,'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok)throw new Error('Save failed: GitHub '+r.status);
 say('Saved ✓ — extensions pick it up on their next sync','ok')}catch(e){say(e.message,'er')}}
$('save').onclick=save;$('load').onclick=load;render();
if(ls('owner')&&ls('token'))load();
</script></body></html>
